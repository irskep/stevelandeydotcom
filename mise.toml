[tools]
"github:irskep/localci" = "0.2.6"
python = "3.13"
uv = "latest"

[tasks."localci:setup"]
description = "Install tools and dependencies for LocalCI runs"
run = [
  "mise install",
  "uv sync",
]

[tasks."localci:build"]
description = "Build the site and expose output as a LocalCI artifact"
run = '''
mise run clean
mise run html

if [ -n "${LOCALCI_TASK_OUTPUT_DIR:-}" ]; then
  mkdir -p "$LOCALCI_TASK_OUTPUT_DIR/site"
  cp -R output/. "$LOCALCI_TASK_OUTPUT_DIR/site/"
  printf 'Site artifact: %s\n' "$LOCALCI_TASK_OUTPUT_DIR/site/index.html"
fi
'''

[tasks.html]
description = "Generate the web site"
run = "uv run pelican content -o output -s pelicanconf.py"

[tasks.clean]
description = "Remove the generated files"
run = "[ ! -d output ] || rm -rf output"

[tasks.regenerate]
description = "Regenerate files upon modification"
run = "uv run pelican -r content -o output -s pelicanconf.py"

[tasks.serve]
description = "Serve site at http://localhost:8000"
run = "uv run pelican -l content -o output -s pelicanconf.py"

[tasks.devserver]
description = "Serve and regenerate together at http://localhost:8011"
run = "uv run pelican -lr content -o output -s pelicanconf.py -p 8011"

[tasks.publish]
description = "Generate using production settings"
run = "uv run pelican content -o output -s publishconf.py"
